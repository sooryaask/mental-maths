<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="No calculator">
  <!-- paper ground so the black body stays legible on dark tab bars -->
  <rect width="100" height="100" rx="14" fill="#f3eee2"/>

  <!-- calculator body -->
  <rect x="30" y="23" width="40" height="54" rx="7" fill="#111111"/>
  <!-- display -->
  <rect x="34.5" y="28" width="31" height="9.5" rx="2.5" fill="#f3eee2"/>
  <!-- keys: 3 x 4 -->
  <g fill="#f3eee2">
    <rect x="34.5" y="43"   width="8.5" height="6" rx="1.8"/>
    <rect x="45.75" y="43"   width="8.5" height="6" rx="1.8"/>
    <rect x="57" y="43"   width="8.5" height="6" rx="1.8"/>
    <rect x="34.5" y="51.5" width="8.5" height="6" rx="1.8"/>
    <rect x="45.75" y="51.5" width="8.5" height="6" rx="1.8"/>
    <rect x="57" y="51.5" width="8.5" height="6" rx="1.8"/>
    <rect x="34.5" y="60"   width="8.5" height="6" rx="1.8"/>
    <rect x="45.75" y="60"   width="8.5" height="6" rx="1.8"/>
    <rect x="57" y="60"   width="8.5" height="6" rx="1.8"/>
    <rect x="34.5" y="68.5" width="8.5" height="6" rx="1.8"/>
    <rect x="45.75" y="68.5" width="8.5" height="6" rx="1.8"/>
    <rect x="57" y="68.5" width="8.5" height="6" rx="1.8"/>
  </g>

  <!-- prohibition sign -->
  <g fill="none" stroke="#e1251b" stroke-width="8.5">
    <circle cx="50" cy="50" r="41"/>
    <path d="M21 21 L79 79"/>
  </g>
</svg>
